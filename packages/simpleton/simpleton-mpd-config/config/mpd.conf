# SimpletonOS MPD configuration
#
# NOTE: audio_output "device" below is filled in automatically by
# simpleton-dac-detect, which finds the attached USB DAC by name each time
# MPD starts and whenever a DAC is plugged in. It only changes this line
# when the DAC named here is not attached, so a manual choice is kept.
#
# Music cards (4 Oct 2026): each card is mounted into MPD as its own
# storage, card-<serial>, by simpleton-card, and MPD keeps one database
# file per card in cache_directory (that file also travels on the card).
# music_directory itself stays empty apart from symlinks to the cards,
# which MPD must not follow (follow_outside_symlinks "no") or every card
# would be indexed twice; the symlinks are for the UI's art lookup.

music_directory    "/storage/music"
follow_outside_symlinks "no"
playlist_directory "/storage/.mpd/playlists"
database {
    plugin          "simple"
    path            "/storage/.mpd/database"
    cache_directory "/storage/.mpd/cache"
}
pid_file           "/storage/.mpd/pid"
state_file         "/storage/.mpd/state"
sticker_file       "/storage/.mpd/sticker.sql"
log_file           "/storage/.mpd/log"

filesystem_charset "UTF-8"

port             "6600"
bind_to_address  "any"

zeroconf_enabled "yes"
zeroconf_name    "SimpletonOS MPD"

# No audio_output_format anywhere in this file - MPD follows the file,
# ALSA follows MPD. That's the whole bit-perfect thesis; do not add one.

audio_output {
    type        "alsa"
    name        "DAC"
    device      "hw:CARD=II,DEV=0"
    dop         "no"
    mixer_type  "none"
}

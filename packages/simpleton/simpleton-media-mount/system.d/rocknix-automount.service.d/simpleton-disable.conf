# SimpletonOS: disable ROCKNIX's games automount.
#
# rocknix-automount mounts any SD card present at boot to
# /storage/games-external and binds it into /storage/roms for emulators.
# SimpletonOS has no emulators, and letting it run means a card inserted
# before power-on lands at a different path than the same card inserted
# later (udevil skips devices that are already mounted) - which would
# break MPD's database paths.
#
# A never-true condition makes systemd skip the unit cleanly: no failure,
# no red line on the boot screen, and upstream's unit file stays untouched.
[Unit]
ConditionPathExists=/simpleton-never-run-rocknix-automount
